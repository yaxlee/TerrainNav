%YAML:1.0
# DGVI-SLAM dataset profile. See config/README.md for units and setup.
cameras:
  - {
    T_SC:
        [ -0.0075171819697106, -0.021326914147533,   0.99974429466148,   0.33621890500324,
          -0.99996634692015,   -0.0031249027089596, -0.0075855131813946, 0.33998184191605,
           0.0032858792430393, -0.99976767186982,  -0.021302705968888, -0.0043846405759289,
           0.0,                 0.0,                 0.0,                1.0      ],

        image_dimension: [1024, 768],

        focal_length: [593.5669, 593.8849],
        principal_point: [513.3945, 401.9319],
        distortion_coefficients: [-0.0998, 0.0828, 0.0030, 0.0011, 0.0],
        distortion_type: radialtangential,
        cam_model: pinhole,
        camera_type: gray,
        mapping: true,
        mapping_rectification: false,
        slam_use: okvis}
camera_parameters:
    timestamp_tolerance: 0.045
    sync_cameras: [0]
    image_delay: 0.0
    online_calibration:
        do_extrinsics: true
        do_extrinsics_final_ba: true
        sigma_r: 0.01
        sigma_alpha: 0.05
        sigma_r_final_ba: 0.03
        sigma_alpha_final_ba: 0.3
    fov_scale: 1.0

imu_parameters:
    use: true
    a_max: 150.0
    g_max: 35.0
    sigma_g_c: 1.5e-03
    sigma_a_c: 8.0e-03
    sigma_bg: 0.01
    sigma_ba: 0.1
    sigma_gw_c: 3.5e-06
    sigma_aw_c: 3.7e-04
    g: 9.81007
    g0: [ 0.0, 0.0, 0.0 ]
    a0: [ 0.0, 0.0, 0.0 ]
    s_a: [ 1.0,  1.0, 1.0 ]
    T_BS:
        [1.0000, 0.0000, 0.0000, 0.0000,
         0.0000, 1.0000, 0.0000, 0.0000,
         0.0000, 0.0000, 1.0000, 0.0000,
         0.0000, 0.0000, 0.0000, 1.0000]

frontend_parameters:
    detection_threshold: 35.0
    absolute_threshold: 120.0
    matching_threshold: 50.0
    octaves: 0
    max_num_keypoints: 1500
    keyframe_overlap: 0.30
    use_cnn: false
    parallelise_detection: false
    num_matching_threads: 1
    mask_rects: [0, 640, 1024, 128]

stationary_parameters:
    enabled: true
    entry_frames: 10
    exit_frames: 10
    min_landmarks: 10
    max_median_pixel_displacement: 0.45
    max_mean_pixel_displacement: 0.90
    sigma_v: 0.01
    sigma_position: 0.01
    sigma_orientation: 0.01
    gps_recovery_pause_after_exit_frames: 150

estimator_parameters:
    num_keyframes: 11
    num_loop_closure_frames: 5
    num_imu_frames: 15
    do_loop_closures: true
    do_final_ba: true
    enforce_realtime: false
    realtime_min_iterations: 2
    realtime_max_iterations: 20
    realtime_time_limit: 0.025
    realtime_num_threads: 1
    full_graph_iterations: 5
    full_graph_num_threads: 1
    p_dbow: 0.4
    drift_percentage_heuristic: 20.0

output_parameters:
    display_topview: false
    display_matches: false
    display_overhead: false
    enable_submapping: false

gps_parameters:
  data_type: geodetic
  r_SA: [0.0, 0.0, 0.0]
  yaw_error_threshold: 2.0
  robust_gps_init: true

  gps_sigma_scale: 0.2
  gps_loss_scale: 0.0
  gps_outlier_scale: 1.0

  gps_enable_reinit: false

  gps_velocity_sigma: 0.1
  gps_velocity_min_dt: 0.2
  gps_velocity_max_dt: 5.0

  gps_enable_legacy_position_alignment: false

  gps_bounded_recovery_enabled: true
  gps_bounded_recovery_residual_threshold: 5.0
  gps_bounded_recovery_exit_threshold: 1.0
  gps_bounded_recovery_consecutive: 2
  gps_bounded_recovery_max_step: 5.0
  gps_bounded_recovery_max_total: 0.0
  gps_bounded_recovery_horizontal_only: true
  gps_bounded_recovery_apply_in_initialised: true
  gps_bounded_recovery_stationary_speed_threshold: 0.6

  gps_min_init_points: 100
  gps_max_init_buffer_points: 100

  gps_max_speed: 20.0
  max_h_err: 15.0
  max_v_err: 60.0
  min_fix_status: 1
  geoid_model: "egm96-5"

dem_parameters:
  use: true
  sigma_h: 10.0
  d_above_ground: 1.8
  r_SA: [0, 0, 0]
  use_dem_height_for_gps: false
