%YAML:1.0
cameras:
     - {T_SC:
        [ -0.10129942,  0.08012895,  0.99162381, -0.00235263,
          -0.99470251,  0.00934964, -0.10236943,  0.00024697,
          -0.01747408, -0.99674066,  0.07875735, -0.00061816,
           0.0,         0.0,         0.0,         1.0],
        
        image_dimension: [1024, 576],
        focal_length: [532.13958439718, 531.012457726124],
        principal_point: [510.83514972918687, 289.7382175515196],
        distortion_coefficients: [0.0014547677274352414, -0.0028180328702112423, 0.0009360507339516973, -0.00023446808593048437, 0.000000],
        distortion_type: radialtangential,
        cam_model: pinhole,
        camera_type: gray, #gray, rgb, gray+depth, rgb+depth
        mapping: true,
        mapping_rectification: false,
        slam_use: okvis}  #none, okvis, okvis-depth, okvis-virtual

# additional camera parameters
camera_parameters:
    timestamp_tolerance: 0.03 # [s] stereo frame out-of-sync tolerance
    sync_cameras: [0] # the cameras that will be synchronised
    image_delay: 0.16092455810744305 # [s] timestamp_camera_correct = timestamp_camera - image_delay
    online_calibration: # some parameters to set the online
        do_extrinsics: false # Do we online-calibrate extrinsics?
        do_extrinsics_final_ba: false # Do we calibrate extrinsics in final BA?
        sigma_r: 0.01 # T_SCi position prior stdev [m]
        sigma_alpha: 0.05 # T_SCi orientation prior stdev [rad]
        sigma_r_final_ba: 0.03 # T_SCi position prior stdev in final BA [m]
        sigma_alpha_final_ba: 0.3 # T_SCi orientation prior stdev in final BA [rad]
    # deep_stereo_indices: [0,1] # [left, right] camera indices for the stereo network
    fov_scale: 1.0 # Divisor for new focal length which is only used when fisheye stereo rectification for dense mapping.

imu_parameters:
    use: true
    a_max: 78.4532 # acceleration saturation [m/s^2]
    g_max: 5.2360 # gyro saturation [rad/s]
    sigma_g_c: 0.001 # gyro noise density [rad/s/sqrt(Hz)]
    sigma_a_c: 0.1 # accelerometer noise density [m/s^2/sqrt(Hz)]
    sigma_bg: 0.01 # gyro bias prior [rad/s]
    sigma_ba: 0.1 # accelerometer bias prior [m/s^2]
    sigma_gw_c: 0.0005 # gyro drift noise density [rad/s^s/sqrt(Hz)]
    sigma_aw_c: 0.005 # accelerometer drift noise density [m/s^2/sqrt(Hz)]
    g: 9.81007 # Earth's acceleration due to gravity [m/s^2]
    g0: [ 0.0, 0.0, 0.0 ] # initial gyro bias [rad/s]
    a0: [ 0.0, 0.0, 0.0 ] # initial accelerometer bias [m/s^2]
    s_a: [ 1.0,  1.0, 1.0 ] # scale factor for accelerometer measurements: a_true = s_a * a_meas + b_a
    # transform Body-Sensor (IMU)
    T_BS:
        [1.0000, 0.0000, 0.0000, 0.0000,
         0.0000, 1.0000, 0.0000, 0.0000,
         0.0000, 0.0000, 1.0000, 0.0000,
         0.0000, 0.0000, 0.0000, 1.0000]

# frontend: detection etc.
frontend_parameters:
    detection_threshold: 48.0 #42.0 # detection threshold. By default the uniformity radius in pixels
    absolute_threshold: 150.0 # absolute Harris corner threshold (noise floor)
    matching_threshold: 40.0 # BRISK descriptor matching threshold
    octaves: 1 # number of octaves for detection. 0 means single-scale at highest resolution
    max_num_keypoints: 600 # restrict to a maximum of this many keypoints per image (strongest ones)
    keyframe_overlap: 0.50 # minimum field-of-view overlap
    use_cnn: true # use the CNN (if available) to filter out dynamic content / sky
    parallelise_detection: true # Run parallel detect & describe.
    num_matching_threads: 4 # Parallelise matching with this number of threads.

# estimator parameters
estimator_parameters:
    num_keyframes: 12 # number of keyframes in optimisation window
    num_loop_closure_frames: 5 # number of loop closure frames in optimisation window
    num_imu_frames: 3 # number of frames linked by most recent nonlinear IMU error terms
    do_loop_closures: true # whether to do VI-SLAM or VIO
    do_final_ba: true # Whether to run a full final BA
    enforce_realtime: false # whether to limit the time budget for optimisation
    realtime_min_iterations: 3 # minimum number of iterations always performed
    realtime_max_iterations: 10 # never do more than these, even if not converged
    realtime_time_limit: 0.035 # time budget for realtime optimisation [s]
    realtime_num_threads: 3 # number of threads for the realtime optimisation
    full_graph_iterations: 15 # don't do more than these for the full (background) optimisation
    full_graph_num_threads: 3 # number of threads for the full (background) optimisation
    p_dbow: 0.4 # Match threshold for dBoW -- unfortunately this varies with setups.
    drift_percentage_heuristic: 1.35 # % allowed drift in loop closures rel. to dist. travelled.

# some options for how and what to output
output_parameters:
    display_topview: true # Displays top view of the trajectory. Might become slow for long sequences.
    display_matches: true  # displays debug video and matches. May be slow.
    display_overhead: false # debug overhead image. Is slow.
    enable_submapping: true # Enable volumetric submapping

