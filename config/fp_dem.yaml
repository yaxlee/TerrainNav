%YAML:1.0
cameras:
  - {
    T_SC:
        [ -0.0075171819697106, -0.021326914147533,   0.99974429466148,   0.33621890500324,
          -0.99996634692015,   -0.0031249027089596, -0.0075855131813946, 0.33998184191605,
           0.0032858792430393, -0.99976767186982,  -0.021302705968888, -0.0043846405759289,
           0.0,                 0.0,                 0.0,                1.0      ],  # body_imu <- vehicle_frame_cam00

        image_dimension: [1024, 768],

        focal_length: [593.5669, 593.8849],
        principal_point: [513.3945, 401.9319],
        distortion_coefficients: [-0.0998, 0.0828, 0.0030, 0.0011, 0.0],
        distortion_type: radialtangential,
        cam_model: pinhole,
        camera_type: gray, #gray, rgb, gray+depth, rgb+depth
        mapping: true,
        mapping_rectification: false,
        slam_use: okvis} #none, okvis, okvis-depth, okvis-virtual
# additional camera parameters
camera_parameters:
    timestamp_tolerance: 0.045 # [s] stereo frame out-of-sync tolerance
    sync_cameras: [0] # the cameras that will be synchronised
    image_delay: 0.0 # [s] vehicle_frame_cam00 timeshift_sensor_body_imu
    online_calibration: # some parameters to set the online
        do_extrinsics: true # Do we online-calibrate extrinsics?
        do_extrinsics_final_ba: true # Do we calibrate extrinsics in final BA?
        sigma_r: 0.01 # T_SCi position prior stdev [m]
        sigma_alpha: 0.05 # T_SCi orientation prior stdev [rad]
        sigma_r_final_ba: 0.03 # T_SCi position prior stdev in final BA [m]
        sigma_alpha_final_ba: 0.3 # T_SCi orientation prior stdev in final BA [rad]
    # deep_stereo_indices: [0, 1] # [left, right] camera indices for the stereo network
    fov_scale: 1.0 # Divisor for new focal length which is only used when fisheye stereo rectification for dense mapping.

imu_parameters:
    use: true
    a_max: 150.0 # acceleration saturation [m/s^2]
    g_max: 35.0 # gyro saturation [rad/s]
    sigma_g_c: 1.5e-03 # gyro noise density [rad/s/sqrt(Hz)] # relaxed from 6.08e-05, was overconfident for typical MEMS IMU
    sigma_a_c: 8.0e-03 # accelerometer noise density [m/s^2/sqrt(Hz)] # relaxed from 1.14e-03
    sigma_bg: 0.01 # gyro bias prior [rad/s]
    sigma_ba: 0.1 # accelerometer bias prior [m/s^2]
    sigma_gw_c: 3.5e-06 # gyro drift noise density [rad/s^s/sqrt(Hz)] # relaxed ~10x from 3.45e-07
    sigma_aw_c: 3.7e-04 # relaxed ~10x from 3.69e-05
    g: 9.81007 # Earth's acceleration due to gravity [m/s^2]
    g0: [ 0.0, 0.0, 0.0 ] # initial gyro bias [rad/s]
    a0: [ 0.0, 0.0, 0.0 ] # initial accelerometer bias [m/s^2]
    s_a: [ 1.0,  1.0, 1.0 ] # scale factor for accelerometer measurements: a_true = s_a * a_meas + b_a
    # transform Body-Sensor (IMU)
    T_BS:
        [1.0000, 0.0000, 0.0000, 0.0000,
         0.0000, 1.0000, 0.0000, 0.0000,
         0.0000, 0.0000, 1.0000, 0.0000,
         0.0000, 0.0000, 0.0000, 1.0000]

frontend_parameters:
    detection_threshold: 35.0 # detection threshold. By default the uniformity radius in pixels
    absolute_threshold: 120.0 # absolute Harris corner threshold (noise floor)
    matching_threshold: 50.0 # BRISK descriptor matching threshold
    octaves: 0 # number of octaves for detection. 0 means single-scale at highest resolution
    max_num_keypoints: 1500 # restrict to a maximum of this many keypoints per image (strongest ones)
    keyframe_overlap: 0.30 # minimum field-of-view overlap
    use_cnn: false # use the CNN (if available) to filter out dynamic content / sky
    parallelise_detection: false # Run parallel detect & describe.
    num_matching_threads: 1 # Parallelise matching with this number of threads.
    # Rectangular regions excluded from feature detection: flat list of [x, y, w, h] groups.
    # Multiple rects: [x0, y0, w0, h0, x1, y1, w1, h1, ...]. Remove to disable.
    mask_rects: [0, 640, 1024, 128]

stationary_parameters:
    enabled: true
    entry_frames: 10
    exit_frames: 10
    min_landmarks: 10
    max_median_pixel_displacement: 0.45
    max_mean_pixel_displacement: 0.90
    sigma_v: 0.01
    sigma_position: 0.01
    sigma_orientation: 0.01
    gps_recovery_pause_after_exit_frames: 150  # Keep bounded GPS recovery off briefly after stop->start to avoid trajectory jumps

estimator_parameters: #11/11/20
    num_keyframes: 11 # number of keyframes in optimisation window, sit:11,fortlee:7
    num_loop_closure_frames: 5 # number of loop closure frames in optimisation window
    num_imu_frames: 15 # number of frames linked by most recent nonlinear IMU error terms
    do_loop_closures: true # whether to do VI-SLAM or VIO
    do_final_ba: false # Whether to run a full final BA
    enforce_realtime: false # whether to limit the time budget for optimisation
    realtime_min_iterations: 2 # minimum number of iterations always performed
    realtime_max_iterations: 20 # never do more than these, even if not converged
    realtime_time_limit: 0.025 # time budget for realtime optimisation [s]
    realtime_num_threads: 1 # number of threads for the realtime optimisation
    full_graph_iterations: 5 # don't do more than these for the full (background) optimisation
    full_graph_num_threads: 1 # number of threads for the full (background) optimisation
    p_dbow: 0.4 # Match threshold for dBoW -- unfortunately this varies with setups.
    drift_percentage_heuristic: 20.0 # % allowed drift in loop closures rel. to dist. travelled.

output_parameters:
    display_topview: false # Displays top view of the trajectory. Might become slow for long sequences.
    display_matches: false  # displays debug video and matches. May be slow.
    display_overhead: false # debug overhead image. Is slow.
    enable_submapping: false # Enable volumetric submapping

gps_parameters:
  data_type: geodetic
  r_SA: [0.0, 0.0, 0.0]
  yaw_error_threshold: 2.0
  robust_gps_init: true

  gps_sigma_scale: 0.2 # sit: 0.2, fortlee:0.1
  gps_loss_scale: 0.0  # [m] Cauchy loss scale for GPS factors; larger pulls back faster, <=0 disables robust loss
  gps_outlier_scale: 1.0  # Multiplier on 3-sigma rejection threshold (1.0=6m, 3.0=18m for sigma=2m)

  gps_dropout_threshold: 12.0  # [s] Min VIO time since last GPS state before re-init triggers (prevents false re-init after GPS loop closure)
  gps_enable_reinit: false  # Keep GPS in status=3 after first initialisation; no post-dropout T_GW re-init

  gps_velocity_sigma: 0.1  # [m/s] Horizontal GPS-derived velocity prior; <=0 disables
  gps_velocity_min_dt: 0.2  # [s] Minimum GPS interval for velocity prior
  gps_velocity_max_dt: 5.0  # [s] Maximum GPS interval for velocity prior

  gps_reinit_position_sigma_scale: 1.0  # Extra sigma scale for weak GPS position factors during ReInitialising; <=0 disables
  gps_reinit_position_loss_scale: 0.0  # [m] Cauchy loss scale for weak ReInitialising GPS position factors; <=0 disables robust loss

  gps_enable_legacy_position_alignment: false  # Disable old dropout/re-init position-only hard pull; GPS velocity prior keeps motion constrained

  gps_bounded_recovery_enabled: true  # Gradually translate the active local window when GPS/VIO residual stays large
  gps_bounded_recovery_residual_threshold: 5.0  # [m] Start bounded recovery above this horizontal residual, sit:5
  gps_bounded_recovery_exit_threshold: 1.0  # [m] Reset bounded recovery once residual drops below this
  gps_bounded_recovery_consecutive: 2  # Require this many consecutive large residuals before correcting
  gps_bounded_recovery_max_step: 5.0  # [m] Maximum local-window translation per GPS update
  gps_bounded_recovery_max_total: 0.0  # [m] Maximum accumulated bounded correction before residual recovers; <=0 disables cap
  gps_bounded_recovery_horizontal_only: true  # Keep altitude untouched during bounded recovery
  gps_bounded_recovery_apply_in_initialised: true  # Also run in normal status=3 GPS mode
  gps_bounded_recovery_apply_in_reinitialising: true  # Also run while collecting re-init GPS points
  gps_bounded_recovery_stationary_speed_threshold: 0.6  # [m/s] Do not translate the local window while GPS says nearly stopped

  gps_max_correction: 10.0  # [m] Max T_GW correction allowed for GPS re-init loop closures
  gps_max_yaw_correction: 1.5  # [deg] Max yaw change allowed for GPS re-init loop closures; <=0 disables

  gps_min_init_points: 100  # Min GPS points for Umeyama alignment (higher = more robust against city multipath)
  gps_min_reinit_points: 30  # Min GPS points for post-dropout re-init alignment
  gps_max_init_buffer_points: 100  # Keep only the newest N GPS points for robust init RANSAC; <=0 disables

  gps_max_speed: 20.0  # [m/s] Reject GPS jumps requiring impossible horizontal speed; <=0 disables
  max_h_err: 15.0      # [m] Reject GPS if horizontal error exceeds this
  max_v_err: 60.0      # [m] Reject GPS if vertical error exceeds this
  min_fix_status: 1    # Reject GPS if fix_status < this (0=no filter, 1=reject status 0)
  geoid_model: "egm96-5"  # GeographicLib geoid model for ellipsoidal->orthometric height correction

dem_parameters:
  use: true
  sigma_h: 10.0
  d_above_ground: 1.8
  r_SA: [0, 0, 0]
  use_dem_height_for_gps: false
  dem_fusion_alpha: 0  # GPS weight in altitude fusion: 0=full DEM, 1=full GPS